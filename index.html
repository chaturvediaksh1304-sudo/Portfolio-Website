<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aksh Chaturvedi — Software · Design · Story</title>
    <meta name="description" content="Aksh Chaturvedi — CS grad building at the intersection of design, code, and story. Software engineering, AI/ML, and product." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // Velorah design system: Instrument Serif display, Inter body, Geist Mono tags.
              serif: ['"Instrument Serif"', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              // Velorah deep-ocean palette. Class names kept for low churn.
              navy: 'hsl(201 100% 13%)', // --bg (deep ocean blue)
              'light-navy': 'hsla(201, 60%, 20%, 0.5)', // translucent panel base
              'lightest-navy': 'hsla(0, 0%, 100%, 0.14)', // glass borders
              slate: '#FFFFFF', // primary text
              'light-slate': '#FFFFFF',
              'lightest-slate': '#FFFFFF',
              muted: 'hsl(240 4% 66%)', // secondary text (Velorah gray)
              white: '#FFFFFF',
              green: 'hsl(240 4% 78%)', // accent alias → soft silver
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --bg: hsl(201 100% 13%);
        --text: hsl(0 0% 100%);
        --muted: hsl(240 4% 66%);
        --font-serif: 'Instrument Serif', Georgia, serif;
        --font-sans: 'Inter', system-ui, sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: hsl(201 100% 10%); }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      /* Muted serif emphasis inside display headlines (Velorah hero style) */
      .serif-accent {
        font-family: var(--font-serif);
        color: var(--muted);
      }
      /* Liquid glass — Velorah glassmorphism surface */
      .liquid-glass {
        background: rgba(255, 255, 255, 0.01);
        background-blend-mode: luminosity;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: none;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
        transition: transform 0.3s ease;
      }
      .liquid-glass.glass-hover { cursor: pointer; }
      .liquid-glass.glass-hover:hover { transform: scale(1.03); }
      .liquid-glass::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
          rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
          rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      /* Heavier glass for content panels — more blur so text stays readable over video */
      .glass-panel {
        background: rgba(4, 32, 51, 0.35);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .nav-link {
        font-size: 0.875rem;
        color: hsl(240 4% 66%);
        text-decoration: none;
        background: none;
        border: none;
        padding: 0;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        transition: color 0.2s ease;
      }
      .nav-link:hover { color: hsl(0 0% 100%); }
      .nav-link.active { color: hsl(0 0% 100%); }
      @keyframes fade-rise {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-rise { animation: fade-rise 0.8s ease-out both; }
      .animate-fade-rise-delay { animation: fade-rise 0.8s ease-out 0.2s both; }
      .animate-fade-rise-delay-2 { animation: fade-rise 0.8s ease-out 0.4s both; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^12.31.0",
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</body>
</html>

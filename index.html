<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aksh Chaturvedi — macOS</title>
    <meta name="description" content="Aksh Chaturvedi — portfolio as a macOS desktop. Projects, experience, and more open as apps." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // System-first per spec §3; Inter is the web fallback for SF Pro.
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'system-ui', 'Inter', 'sans-serif'],
              mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              'mac-red': '#ff5f57',
              'mac-yellow': '#febc2e',
              'mac-green': '#28c840',
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --bg: hsl(201 100% 13%);
        --text: hsl(0 0% 100%);
        --muted: hsl(240 4% 66%);
        --font-serif: 'Instrument Serif', Georgia, serif;
        --font-sans: 'Inter', system-ui, sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: hsl(201 100% 10%); }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }
      body {
        /* macOS-style wallpaper (swappable — spec §12). */
        background: linear-gradient(150deg, #0b1e3f 0%, #2b5876 45%, #4e4376 100%) fixed;
        color: #fff;
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow: hidden; /* desktop shell owns its own scrolling */
      }
      /* Shared macOS liquid-glass surface (spec §5 — defined once, reused). */
      .glass-surface {
        background: rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .glass-dark {
        background: rgba(28, 30, 38, 0.72);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
      }
      /* Muted serif emphasis inside display headlines (Velorah hero style) */
      .serif-accent {
        font-family: var(--font-serif);
        color: var(--muted);
      }
      /* Liquid glass — Velorah glassmorphism surface */
      .liquid-glass {
        background: rgba(255, 255, 255, 0.01);
        background-blend-mode: luminosity;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: none;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
        transition: transform 0.3s ease;
      }
      .liquid-glass.glass-hover { cursor: pointer; }
      .liquid-glass.glass-hover:hover { transform: scale(1.03); }
      .liquid-glass::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
          rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
          rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      /* Heavier glass for content panels — more blur so text stays readable over video */
      .glass-panel {
        background: rgba(4, 32, 51, 0.35);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .nav-link {
        font-size: 0.875rem;
        color: hsl(240 4% 66%);
        text-decoration: none;
        background: none;
        border: none;
        padding: 0;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        transition: color 0.2s ease;
      }
      .nav-link:hover { color: hsl(0 0% 100%); }
      .nav-link.active { color: hsl(0 0% 100%); }
      @keyframes fade-rise {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-rise { animation: fade-rise 0.8s ease-out both; }
      .animate-fade-rise-delay { animation: fade-rise 0.8s ease-out 0.2s both; }
      .animate-fade-rise-delay-2 { animation: fade-rise 0.8s ease-out 0.4s both; }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

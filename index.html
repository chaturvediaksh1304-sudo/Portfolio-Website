<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aksh Chaturvedi — Software · Design · Story</title>
    <meta name="description" content="Aksh Chaturvedi — CS grad building at the intersection of design, code, and story. Software engineering, AI/ML, and product." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // Matching harshitsuri.com: Geist sans, Newsreader serif accent, Geist Mono.
              sans: ['Geist', 'Inter', 'system-ui', 'sans-serif'],
              serif: ['Newsreader', 'Georgia', 'serif'],
              mono: ['"Geist Mono"', '"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              // Editorial near-black + warm amber. Existing class names kept,
              // only values changed to avoid touching every component.
              navy: '#0D0D0D', // --bg (main background)
              'light-navy': '#151515', // --surface (card background)
              'lightest-navy': '#262626', // subtle borders
              slate: '#E8E3DC', // --text (warm off-white body)
              'light-slate': '#E8E3DC', // headings
              'lightest-slate': '#FFFFFF', // brightest
              muted: '#6B6B6B', // --muted (labels, timestamps)
              white: '#FFFFFF',
              green: '#D4A853', // accent alias used across components → amber
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --bg: #0D0D0D;
        --surface: #151515;
        --text: #E8E3DC;
        --muted: #6B6B6B;
        --accent: #D4A853;
        --font-sans: 'Geist', 'Inter', system-ui, sans-serif;
        --font-serif: 'Newsreader', Georgia, serif;
        --font-mono: '"Geist Mono", "JetBrains Mono", ui-monospace, monospace';
        --max-width: 680px;
      }
      html {
        scroll-padding-top: 80px; /* Offset for slim fixed navbar */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0D0D0D;
      }
      ::-webkit-scrollbar-thumb {
        background: #262626;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D4A853;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      /* Important words — Newsreader serif italic in warm amber (like harshitsuri.com's "AI-native") */
      .serif-accent {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        color: var(--accent);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^12.31.0",
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

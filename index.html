<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aksh Chaturvedi — macOS</title>
    <meta name="description" content="Aksh Chaturvedi — portfolio as a macOS desktop. Projects, experience, and more open as apps." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // System-first per spec §3; Inter is the web fallback for SF Pro.
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'system-ui', 'Inter', 'sans-serif'],
              mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              'mac-red': '#ff5f57',
              'mac-yellow': '#febc2e',
              'mac-green': '#28c840',
            },
          },
        },
      }
    </script>
    <style>
      @font-face { font-family: 'Brother 1816'; src: url('/fonts/brother-regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'Brother 1816'; src: url('/fonts/brother-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
      @font-face { font-family: 'Brother 1816'; src: url('/fonts/brother-black.woff2') format('woff2'); font-weight: 900; font-display: swap; }
      .font-brother { font-family: 'Brother 1816', 'Inter', sans-serif; }
      :root {
        --bg: hsl(201 100% 13%);
        --text: hsl(0 0% 100%);
        --muted: hsl(240 4% 66%);
        --font-serif: 'Instrument Serif', Georgia, serif;
        --font-sans: 'Inter', system-ui, sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: hsl(201 100% 10%); }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }
      body {
        background: #000000;
        color: #fff;
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
        letter-spacing: -0.006em;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden; /* desktop shell owns its own scrolling */
        cursor: url('/cursors/normal-select.svg') 4 4, auto;
      }
      a, button, [role="button"], .win-titlebar .tl { cursor: url('/cursors/link-select.svg') 6 2, pointer; }
      input, textarea { cursor: url('/cursors/text-select.svg') 4 8, text; }
      /* Shared macOS liquid-glass surface (spec §5 — defined once, reused). */
      .glass-surface {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(30px) saturate(190%);
        -webkit-backdrop-filter: blur(30px) saturate(190%);
        border: 0.5px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          0 10px 40px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.04);
      }
      /* Window/menubar material — thicker, darker vibrancy. */
      .glass-dark {
        background: rgba(22, 24, 32, 0.62);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
      }
      /* Glossy squircle app icon (Apple-style depth: top highlight, bottom shade, drop shadow). */
      .app-icon {
        border-radius: 23%;
        position: relative;
        color: #fff;
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.55),
          inset 0 -3px 8px rgba(0, 0, 0, 0.28),
          0 5px 12px rgba(0, 0, 0, 0.38);
      }
      /* Top-half gloss sweep. */
      .app-icon::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
        pointer-events: none;
      }
      /* Traffic-light hover glyphs (revealed when title bar is hovered). */
      .win-titlebar .tl { position: relative; }
      .win-titlebar .tl::after {
        content: '';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.12s;
      }
      /* Dock launch bounce (macos-web style). */
      @keyframes dock-bounce {
        0%   { transform: translateY(0); }
        20%  { transform: translateY(-34px); }
        40%  { transform: translateY(0); }
        55%  { transform: translateY(-16px); }
        72%  { transform: translateY(0); }
        86%  { transform: translateY(-6px); }
        100% { transform: translateY(0); }
      }
      .dock-bounce { animation: dock-bounce 0.9s ease-out; }
      .win-titlebar:hover .tl-close::after { content: '×'; opacity: 1; }
      .win-titlebar:hover .tl-min::after { content: '−'; opacity: 1; }
      .win-titlebar:hover .tl-zoom::after { content: '+'; opacity: 1; }
      /* Muted serif emphasis inside display headlines (Velorah hero style) */
      .serif-accent {
        font-family: var(--font-serif);
        color: var(--muted);
      }
      /* Liquid glass — Velorah glassmorphism surface */
      .liquid-glass {
        background: rgba(255, 255, 255, 0.01);
        background-blend-mode: luminosity;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: none;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
        transition: transform 0.3s ease;
      }
      .liquid-glass.glass-hover { cursor: pointer; }
      .liquid-glass.glass-hover:hover { transform: scale(1.03); }
      .liquid-glass::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
          rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
          rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      /* Heavier glass for content panels — more blur so text stays readable over video */
      .glass-panel {
        background: rgba(4, 32, 51, 0.35);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .nav-link {
        font-size: 0.875rem;
        color: hsl(240 4% 66%);
        text-decoration: none;
        background: none;
        border: none;
        padding: 0;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        transition: color 0.2s ease;
      }
      .nav-link:hover { color: hsl(0 0% 100%); }
      .nav-link.active { color: hsl(0 0% 100%); }
      @keyframes fade-rise {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-rise { animation: fade-rise 0.8s ease-out both; }
      .animate-fade-rise-delay { animation: fade-rise 0.8s ease-out 0.2s both; }
      .animate-fade-rise-delay-2 { animation: fade-rise 0.8s ease-out 0.4s both; }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
